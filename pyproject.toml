[project]
name = "logstats"
version = "0.1.0"
description = "A small CLI tool that computes statistics from log files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
]

[build-system]
requires = ["uv_build >= 0.11.23, <0.12.0"]
build-backend = "uv_build"

[project.scripts]
logstats="logstats.cli:parse_aguments"

[tool.pytest.ini_options]
testpaths = ["Tests"]

[tool.mypy]
files = ["src", "Tests"]
strict = true

[[tool.mypy.overrides]]
module = "Tests.*"
disallow_untyped_defs = false
disallow_incomplete_defs = false

[dependency-groups]
dev = [
    "hypothesis>=6.161.0",
    "mypy>=2.3.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.15.22",
]

