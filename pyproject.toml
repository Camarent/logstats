[project]
name = "logstats"
version = "0.1.0"
description = "A small CLI tool that computes statistics from log files"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.4.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["Tests"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
]

