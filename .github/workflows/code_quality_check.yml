name: Code Quality
on: [push, pull_request]
jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: astral-sh/setup-uv@5
            - run: uv sync
            - run: uv run ruff check
            - run: uv run ruff format --check
            - run: uv run mypy src
            - run: uv run pytest